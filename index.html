<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Крестики-нолики</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Крестики-нолики</h1>
      <p class="subtitle">Ты играешь за <span class="badge x">X</span>. Бот играет за <span class="badge o">O</span>.</p>
    </header>

    <section class="board" id="board" aria-label="Игровое поле">
      <button class="cell" data-index="0" aria-label="Клетка 1"></button>
      <button class="cell" data-index="1" aria-label="Клетка 2"></button>
      <button class="cell" data-index="2" aria-label="Клетка 3"></button>
      <button class="cell" data-index="3" aria-label="Клетка 4"></button>
      <button class="cell" data-index="4" aria-label="Клетка 5"></button>
      <button class="cell" data-index="5" aria-label="Клетка 6"></button>
      <button class="cell" data-index="6" aria-label="Клетка 7"></button>
      <button class="cell" data-index="7" aria-label="Клетка 8"></button>
      <button class="cell" data-index="8" aria-label="Клетка 9"></button>
    </section>

    <section class="status" aria-live="polite">
      <div class="status-text">
        <p id="statusText">Твой ход. Поставь X.</p>
        <div class="difficulty">
          <label for="difficultySelect">Сложность:</label>
          <select id="difficultySelect">
            <option value="easy">Легкая</option>
            <option value="medium">Средняя</option>
            <option value="hard">Сложная</option>
          </select>
        </div>
      </div>
      <button id="restart" class="restart">Начать заново</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
